<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imbul Forever – karakterek</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/i18n.js"></script>
<script src="/themes.js"></script>
</head>
<body>
<main>
  <header class="site-header">
    <h1><a class="home-link" href="/">Imbul Forever</a></h1>
    <nav class="site-nav" aria-label="Oldalak" data-i18n-aria>
      <a class="nav-link" href="/" aria-current="page" data-i18n>Lista oldal</a>
      <a class="nav-link" href="/magyaritas/" data-i18n>Magyarítás</a>
    </nav>
    <!-- The admin area asks for a user name and password (Caddy basic auth). -->
    <a class="admin-button" href="/admin/">Admin</a>
  </header>

  <section>
    <div class="list-head">
      <h2 data-i18n>Karakterek</h2>
      <span id="count" class="count"></span>
      <span class="info" tabindex="0" role="note" aria-label="Infó a Blizzard adatokról" data-i18n-aria>
        <span class="info-icon" aria-hidden="true">i</span>
        <span class="info-text" data-i18n>A Blizzard API csak a legalább 10-es szintű karaktereket adja vissza, és egy karakter adatai csak akkor frissülnek, amikor kilép a játékból.</span>
      </span>
    </div>
    <div class="table-wrap">
      <table class="characters">
        <thead>
          <tr>
            <th data-i18n>Név</th>
            <th data-i18n>Kié</th>
            <th data-i18n>Frakció</th>
            <th data-i18n>Kaszt</th>
            <th class="num" data-i18n>Szint</th>
            <th data-i18n>Faj</th>
            <th data-i18n>Szakmák</th>
            <th data-i18n>Játékmód</th>
            <th data-i18n>Utoljára frissült</th>
          </tr>
        </thead>
        <tbody id="character-rows">
          <tr><td colspan="9" class="empty" data-i18n>Betöltés…</td></tr>
        </tbody>
      </table>
    </div>
    <aside id="tip-card" class="tip-card" hidden>
      <span class="tip-icon" aria-hidden="true">💡</span>
      <p id="tip-text"></p>
    </aside>
  </section>
</main>
<footer class="site-footer" id="site-footer" hidden></footer>
<script src="/shared.js"></script>
<script src="/app.js"></script>
</body>
</html>
