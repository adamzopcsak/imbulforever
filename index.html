<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imbul Forever – karakterek</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Imbul Forever</h1>
    <p class="subtitle">WoW: Forever karakterek</p>
  </header>

  <section>
    <div class="list-head">
      <h2>Karakterek</h2>
      <span id="count" class="count"></span>
    </div>
    <table class="characters">
      <thead>
        <tr>
          <th>Név</th>
          <th>Kaszt</th>
          <th class="num">Szint</th>
          <th>Faj</th>
          <th>Szerep</th>
        </tr>
      </thead>
      <tbody id="character-rows">
        <tr><td colspan="5" class="empty">Betöltés…</td></tr>
      </tbody>
    </table>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
