<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imbul Forever – karakterek</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header class="site-header">
    <h1>Imbul Forever</h1>
    <!-- The admin area asks for a user name and password (Caddy basic auth). -->
    <a class="admin-button" href="/admin/">Admin</a>
  </header>

  <section>
    <div class="list-head">
      <h2>Karakterek</h2>
      <span id="count" class="count"></span>
    </div>
    <table class="characters">
      <thead>
        <tr>
          <th>Név</th>
          <th>Kaszt</th>
          <th class="num">Szint</th>
          <th>Faj</th>
          <th>Professions</th>
          <th>Roleset</th>
        </tr>
      </thead>
      <tbody id="character-rows">
        <tr><td colspan="6" class="empty">Betöltés…</td></tr>
      </tbody>
    </table>
  </section>
</main>
<script src="/shared.js"></script>
<script src="/app.js"></script>
</body>
</html>
