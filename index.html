<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imbul Forever – karakterek</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/themes.js"></script>
</head>
<body>
<main>
  <header class="site-header">
    <h1><a class="home-link" href="/">Imbul Forever</a></h1>
    <nav class="site-nav" aria-label="Oldalak">
      <a class="nav-link" href="/" aria-current="page">List oldal</a>
      <a class="nav-link" href="/magyaritas/">Magyarítás</a>
    </nav>
    <!-- The admin area asks for a user name and password (Caddy basic auth). -->
    <a class="admin-button" href="/admin/">Admin</a>
  </header>

  <section>
    <div class="list-head">
      <h2>Karakterek</h2>
      <span id="count" class="count"></span>
      <span class="info" tabindex="0" role="note" aria-label="Infó a Blizzard adatokról">
        <span class="info-icon" aria-hidden="true">i</span>
        <span class="info-text">A Blizzard API csak a legalább 10-es szintű karaktereket adja vissza, és egy karakter adatai csak akkor frissülnek, amikor kilép a játékból.</span>
      </span>
    </div>
    <div class="table-wrap">
      <table class="characters">
        <thead>
          <tr>
            <th>Név</th>
            <th>Kié</th>
            <th>Frakció</th>
            <th>Kaszt</th>
            <th class="num">Szint</th>
            <th>Faj</th>
            <th>Professions</th>
            <th>Roleset</th>
            <th>Utolsó belépés</th>
          </tr>
        </thead>
        <tbody id="character-rows">
          <tr><td colspan="9" class="empty">Betöltés…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
<footer class="site-footer" id="site-footer" hidden></footer>
<script src="/shared.js"></script>
<script src="/app.js"></script>
</body>
</html>
